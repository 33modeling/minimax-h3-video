[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts"
version = "0.1.0"
description = "프롬프트 JSON(+소스 영상)으로 9:16 숏폼을 만드는 CLI — 사용자 영상 생성 서버(SGLang/vLLM/h3video) + ffmpeg"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shorts = "shorts.cli:main"

[tool.setuptools]
packages = ["shorts"]
