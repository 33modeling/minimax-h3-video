[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3video"
version = "0.1.0"
description = "MiniMax-H3 (Hailuo 3.0) 서빙 클라이언트 — 텍스트/이미지/레퍼런스로 오디오 포함 동영상 생성"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serve = ["sglang[diffusion]"]
diffusers = ["diffusers", "transformers", "accelerate", "torch", "torchvision", "torchaudio", "av"]   # 버전은 constraints/h100-cu126-diffusers.txt
dev = ["pytest"]

[project.scripts]
h3video = "h3video.cli:main"
shorts = "shorts.cli:main"          # 숏폼 제작 (shortform/)

[tool.setuptools.packages.find]
where = ["src", "shortform"]
include = ["h3video*", "shorts*"]
